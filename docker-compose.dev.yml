services:

  backend:
    build:
      context: ./backend
    container_name: olivia-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    image: node:22
    container_name: olivia-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend