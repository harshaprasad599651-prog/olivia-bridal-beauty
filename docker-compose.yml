services:

  backend:
    build:
      context: ./backend
    container_name: olivia-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: olivia-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend